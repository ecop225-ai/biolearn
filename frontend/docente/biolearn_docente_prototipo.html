<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioLearn — Prototipo Docente</title>
<link rel="stylesheet" href="biolearn_docente_prototipo.css">
</head>
<body>

<aside id="sidebar"></aside>

<div style="flex:1;min-width:0;display:flex;flex-direction:column">
  <div id="topbar">
    <div class="tb-left">
      <button class="tb-menu-btn" onclick="toggleSidebar()" title="Mostrar/ocultar menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tb-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar...">
      </div>
    </div>
    <div class="tb-notif-wrap">
      <button class="tb-notif-btn" onclick="toggleNotif()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="tb-notif-badge" id="notif-badge" style="display:none">0</span>
      </button>
      <div class="tb-notif-panel" id="notif-panel"></div>
    </div>
  </div>

  <main id="app-content"></main>
</div>

<div id="toast-wrap"></div>

<script src="biolearn_docente_core.js"></script>
<script src="biolearn_docente_inicio.js"></script>
<script src="biolearn_docente_cursos.js"></script>
<script src="biolearn_docente_materiales.js"></script>
<script src="biolearn_docente_actividades.js"></script>
<script src="biolearn_docente_evaluaciones.js"></script>
<script src="biolearn_docente_foros.js"></script>
<script src="biolearn_docente_sesiones_eventos.js"></script>
<script src="biolearn_docente_seguimiento.js"></script>
<script src="biolearn_docente_comunicacion.js"></script>
</body>
</html>
