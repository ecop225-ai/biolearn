# =====================================================================
# BioLearn · Configuración de Apache (se incluye al final de httpd.conf)
#   /                     → portales del frontend (carpeta frontend/ del repositorio, montada en htdocs)
#   /api, /swagger-ui,
#   /v3/api-docs          → backend de Spring Boot (servicio «backend» de docker-compose, puerto 8080)
#   HTTPS                 → se activa solo cuando existe el certificado de Let's Encrypt del dominio (scripts/https.sh)
# Como el frontend y la API quedan en la misma dirección, el navegador no necesita CORS.
# =====================================================================
ServerName biolearn
ServerTokens Prod
ServerSignature Off

AddDefaultCharset UTF-8
AddCharset UTF-8 .html .js .css .json .md

# La raíz del sitio abre la pantalla de inicio de sesión
RedirectMatch 302 ^/$ /prototipo-auth/biolearn_auth_prototipo.html

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Proxy inverso hacia el backend (la cabecera Host original se conserva)
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 120
ProxyPass        /api/          http://backend:8080/api/
ProxyPassReverse /api/          http://backend:8080/api/
ProxyPass        /swagger-ui/   http://backend:8080/swagger-ui/
ProxyPassReverse /swagger-ui/   http://backend:8080/swagger-ui/
ProxyPass        /swagger-ui.html http://backend:8080/swagger-ui.html
ProxyPassReverse /swagger-ui.html http://backend:8080/swagger-ui.html
ProxyPass        /v3/api-docs   http://backend:8080/v3/api-docs
ProxyPassReverse /v3/api-docs   http://backend:8080/v3/api-docs

# Tamaño máximo de lo que se sube (comprobantes y PDF de los cursos)
LimitRequestBody 26214400

# Compresión de textos
AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json

# Cabeceras de seguridad básicas
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Los portales cambian a menudo durante el proyecto: que el navegador revise si hay versión nueva
<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# =====================================================================
# HTTPS con Let's Encrypt
# El dominio llega en la variable DOMINIO (archivo .env). Mientras no exista su certificado, este bloque se
# ignora y el sitio sigue en HTTP. scripts/https.sh obtiene el certificado y reinicia Apache.
# =====================================================================
# Validación de Let's Encrypt: certbot deja aquí el archivo que prueba que el dominio apunta a este servidor
Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
<Directory "/var/www/certbot">
    Require all granted
</Directory>

<IfFile "/etc/letsencrypt/live/${DOMINIO}/fullchain.pem">
    Listen 443
    SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <VirtualHost *:443>
        ServerName ${DOMINIO}
        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/${DOMINIO}/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/${DOMINIO}/privkey.pem
        # El backend sabe que la petición original llegó por HTTPS (enlaces y Swagger con https://)
        RequestHeader set X-Forwarded-Proto "https"
        Header always set Strict-Transport-Security "max-age=31536000"
    </VirtualHost>

    # Todo lo que llegue por HTTP (por el dominio o por la IP) se envía a https://dominio,
    # menos la validación de Let's Encrypt, que debe seguir funcionando por HTTP para renovar el certificado
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${DOMINIO}%{REQUEST_URI} [R=301,L]
</IfFile>
